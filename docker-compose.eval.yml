# Organizer-only. Used to run every team's submitted repo copy simultaneously
# for the hidden evaluation, each on its own port. NOT used by teams during
# development — teams work inside the Dev Container instead (see .devcontainer/).
#
# Usage: copy each team's submission into teams/<team-name>/ (a full copy of
# this repo with their changes), add one service block per team below (or
# generate this file with a small script), then:
#
#   docker compose -f docker-compose.eval.yml up --build -d
#
# Each team submits its own hidden-run results to the leaderboard (see
# .github/skills/rag-eval-report), so no organizer-side fan-out/registry is
# needed here — this file only needs to get each team's app running and
# reachable so the team can point its own evaluator at it.

services:
  team-baseline:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TEAM_NAME=baseline

