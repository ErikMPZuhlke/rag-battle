openapi: 3.1.0
info:
  title: Acme Cloud Knowledge Assistant
  description: >
    RAG API for the Acme Cloud internal knowledge base. See
    ../README.md for setup and PARTICIPANT_RULES.md for usage constraints.
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
  /ask:
    post:
      summary: Ask a question against the knowledge base
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
            example:
              question: What is the SLA for P1 incidents?
      responses:
        "200":
          description: Grounded answer with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
              example:
                answer: "..."
                sources:
                  - document: sla.md
                    section: P1 incidents
        "422":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: Per-question resource budget exceeded (LLM calls / retrievals / input tokens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
components:
  schemas:
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
      required: [question]
    Source:
      type: object
      properties:
        document:
          type: string
        section:
          type: [string, "null"]
      required: [document]
    AskResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
      required: [answer, sources]
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required: [detail]
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string
